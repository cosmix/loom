name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip release creation)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  MINISIGN_VERSION: "0.11"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: loom-linux-x86_64
          - name: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            binary_name: loom-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            loom/target/
          key: ${{ runner.os }}-cargo-v2-${{ matrix.target }}-${{ hashFiles('loom/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-${{ matrix.target }}-
            ${{ runner.os }}-cargo-v2-

      - name: Build release binary
        working-directory: loom
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip loom/target/${{ matrix.target }}/release/loom

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip loom/target/${{ matrix.target }}/release/loom

      - name: Rename binary
        run: |
          cp loom/target/${{ matrix.target }}/release/loom ${{ matrix.binary_name }}
          chmod +x ${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          if-no-files-found: error

  verify-version:
    name: Verify binary version matches tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux binary artifact
        uses: actions/download-artifact@v8
        with:
          name: loom-linux-x86_64

      - name: Compare tag to the binary's reported version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          chmod +x loom-linux-x86_64
          TAG_NAME=${GITHUB_REF#refs/tags/}
          EXPECTED=${TAG_NAME#v}
          REPORTED=$(./loom-linux-x86_64 -v | head -n1 | awk '{print $2}')
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "Version mismatch: tag $TAG_NAME does not match binary version $REPORTED"
            exit 1
          fi

  sign-and-release:
    name: Sign and Release
    needs: [build, verify-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release directory
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          chmod +x release/loom-*
          ls -la release/

      - name: Install minisign
        run: |
          curl -sL "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz" -o minisign.tar.gz
          tar -xzf minisign.tar.gz
          sudo mv minisign-linux/x86_64/minisign /usr/local/bin/
          rm -rf minisign.tar.gz minisign-linux
          minisign -v

      - name: Sign binaries
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          set -e

          KEYFILE=$(mktemp)
          trap 'rm -f "$KEYFILE"' EXIT

          echo "$MINISIGN_PRIVATE_KEY" > "$KEYFILE"

          cd release
          for binary in loom-*; do
            if [ -f "$binary" ] && [ ! "${binary##*.}" = "minisig" ]; then
              echo "Signing $binary..."
              minisign -Sm "$binary" -s "$KEYFILE" -t "loom release binary"
            fi
          done

          rm -f "$KEYFILE"

          ls -la

      # The public key is read out of the source that `loom update` trusts, so a
      # signing secret from a different keypair fails the release here instead of
      # after publishing - and the release notes below quote the same value rather
      # than a copy that can drift. `grep` rather than `rg`: the runner image
      # guarantees only POSIX tools.
      - name: Verify signatures against the embedded public key
        id: pubkey
        run: |
          set -euo pipefail

          PUBKEY=$(grep -oE -m1 'RW[A-Za-z0-9+/=]{40,}' loom/src/commands/self_update/signature.rs) || {
            echo "Could not read MINISIGN_PUBLIC_KEY from loom/src/commands/self_update/signature.rs"
            exit 1
          }
          echo "public_key=${PUBKEY}" >> "$GITHUB_OUTPUT"

          cd release
          for binary in loom-*; do
            if [ -f "$binary" ] && [ ! "${binary##*.}" = "minisig" ]; then
              echo "Verifying $binary..."
              minisign -Vm "$binary" -P "$PUBKEY"
            fi
          done

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum loom-* > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
            TAG="dev-build"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            TAG=$TAG_NAME
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Tag: $TAG"

      # The trailing "What's Changed" heading is deliberately absent: the release
      # is created with `generate_release_notes: true`, and GitHub appends its own
      # "## What's Changed" section after this body. Adding one here duplicates it.
      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'RELEASE_NOTES_EOF'
          ## loom ${{ steps.version.outputs.version }}

          ### Installation

          The binary alone is not a working loom install. Loom's agents, skills, commands, hooks and orchestration rules are embedded in it and get written to `~/.claude/` and `~/.codex/` by `loom install-assets`, which the installer below runs for you.

          **Recommended (Linux x86_64 and macOS Apple Silicon):**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          ```
          This downloads the signed binary for your platform to `~/.local/bin/loom` (make sure that directory is on your `PATH`) and runs `loom install-assets`. Requires `jq`; `ripgrep` and `fd` are recommended.

          **Windows (WSL2):** supported — the installer above picks the Linux x86_64 binary. Run stages on the
          tmux backend (`loom run --backend tmux`); a stock WSL install ships no Linux GUI stack,
          so the native backend has no terminal emulator to detect. Details:
          [Running under WSL](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md#running-under-wsl).

          **Manual, pinned to this release (Linux x86_64):**
          ```bash
          mkdir -p ~/.local/bin
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/loom-linux-x86_64 -o ~/.local/bin/loom
          chmod +x ~/.local/bin/loom
          ~/.local/bin/loom install-assets
          ```

          **Manual, pinned to this release (macOS Apple Silicon):**
          ```bash
          mkdir -p ~/.local/bin
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/loom-darwin-arm64 -o ~/.local/bin/loom
          chmod +x ~/.local/bin/loom
          ~/.local/bin/loom install-assets
          ```

          ### Verify Signature

          Each binary ships with a minisign signature, already checked in CI against
          the public key `loom update` has embedded. Later upgrades via `loom update` verify the signature automatically.
          ```bash
          minisign -Vm loom-linux-x86_64 -P ${{ steps.pubkey.outputs.public_key }}
          ```

          ### Checksums

          ```bash
          # Linux
          sha256sum -c SHA256SUMS.txt --ignore-missing

          # macOS - check the one binary you downloaded
          grep loom-darwin-arm64 SHA256SUMS.txt | shasum -a 256 -c
          ```

          ### Changelog

          [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md)
          RELEASE_NOTES_EOF

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: softprops/action-gh-release@v3
        with:
          name: loom ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            release/loom-linux-x86_64
            release/loom-linux-x86_64.minisig
            release/loom-darwin-arm64
            release/loom-darwin-arm64.minisig
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary (Dry Run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "=== DRY RUN - Release would include these files ==="
          ls -la release/
          echo ""
          echo "=== SHA256SUMS.txt ==="
          cat release/SHA256SUMS.txt
          echo ""
          echo "=== Release Notes ==="
          cat release_notes.md
