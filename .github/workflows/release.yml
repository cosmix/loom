name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip release creation)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MINISIGN_VERSION: "0.11"
  MINISIGN_LINUX_SHA256: "f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0"

jobs:
  release-contract:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read supported release targets
        id: contract
        shell: bash
        run: |
          LOOM_INSTALL_LIB_ONLY=1 source ./install.sh
          export RELEASE_ASSETS
          matrix=$(python3 -c 'import json, os; runners = {"Linux": "ubuntu-latest", "Darwin": "macos-latest"}; print(json.dumps({"include": [{"name": asset, "target": target, "os": runners[platform], "binary_name": asset} for target, platform, arch, asset in (row.split(",") for row in os.environ["RELEASE_ASSETS"].splitlines())]}))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: release-contract
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-contract.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check release asset contract
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          LOOM_INSTALL_LIB_ONLY=1 source ./install.sh
          expected=$(printf '%s\n' "$RELEASE_ASSETS" | awk -F, -v target="$TARGET" '$1 == target {print $4}')
          test "$expected" = "$BINARY_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No cache: a cache saved under a tag ref is invisible to every later
      # tag, and main never builds the release profile.
      - name: Build release binary
        working-directory: loom
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"

      - name: Strip binary
        env:
          TARGET: ${{ matrix.target }}
        run: strip "loom/target/$TARGET/release/loom"

      - name: Rename binary
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          cp "loom/target/$TARGET/release/loom" "$BINARY_NAME"
          chmod +x "$BINARY_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # The suite runs again here because the tag commit builds a release
      # version, which some tests branch on. The flake check is left to CI on
      # main: timing races do not depend on the version.
      # Confined verification runs criteria under bubblewrap on Linux, and
      # Ubuntu's AppArmor denies the unprivileged user namespace it needs.
      - name: Install tmux and bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y tmux bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        working-directory: loom
        run: cargo test --all-targets

  verify-version:
    name: Verify binary version matches tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: loom-linux-x86_64

      - name: Compare tag to the binary's reported version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          chmod +x loom-linux-x86_64
          TAG_NAME=${GITHUB_REF#refs/tags/}
          EXPECTED=${TAG_NAME#v}
          REPORTED=$(./loom-linux-x86_64 -v | head -n1 | awk '{print $2}')
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "Version mismatch: tag $TAG_NAME does not match binary version $REPORTED"
            exit 1
          fi

  sign-and-release:
    name: Sign and Release
    needs: [build, verify-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Prepare release directory
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          chmod +x release/loom-*
          ls -la release/

      - name: Install minisign
        run: |
          curl -fsSL "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz" -o minisign.tar.gz
          echo "${MINISIGN_LINUX_SHA256}  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz
          sudo mv minisign-linux/x86_64/minisign /usr/local/bin/
          rm -rf minisign.tar.gz minisign-linux
          minisign -v

      - name: Sign binaries
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          set -e
          LOOM_INSTALL_LIB_ONLY=1 source ./install.sh

          KEYFILE=$(mktemp)
          trap 'rm -f "$KEYFILE"' EXIT

          echo "$MINISIGN_PRIVATE_KEY" > "$KEYFILE"

          cd release
          for binary in loom-*; do
            if [ -f "$binary" ] && [ ! "${binary##*.}" = "minisig" ]; then
              echo "Signing $binary..."
              minisign -Sm "$binary" -x "$binary$SIGNATURE_SUFFIX" -s "$KEYFILE" -t "loom release binary"
            fi
          done

          rm -f "$KEYFILE"

          ls -la

      # Bootstrap, updater and CI all read the installer's pinned contract.
      - name: Verify signatures against the embedded public key
        id: pubkey
        run: |
          set -euo pipefail

          LOOM_INSTALL_LIB_ONLY=1 source ./install.sh
          PUBKEY="$MINISIGN_PUBLIC_KEY"
          echo "public_key=${PUBKEY}" >> "$GITHUB_OUTPUT"

          cd release
          for binary in loom-*; do
            if [ -f "$binary" ] && [ ! "${binary##*.}" = "minisig" ]; then
              echo "Verifying $binary..."
              minisign -Vm "$binary" -x "$binary$SIGNATURE_SUFFIX" -P "$PUBKEY"
            fi
          done

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum loom-* > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
            TAG="dev-build"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            TAG=$TAG_NAME
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Tag: $TAG"

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if bash scripts/changelog-section.sh CHANGELOG.md "$VERSION" > changelog_section.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            : > changelog_section.md
          fi

      # The trailing "What's Changed" heading is deliberately absent: the release
      # is created with `generate_release_notes: true`, and GitHub appends its own
      # "## What's Changed" section after this body. Adding one here duplicates it.
      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          CHANGELOG_FOUND: ${{ steps.changelog.outputs.found }}
        run: |
          printf '## loom %s\n\n' "$VERSION" > release_notes.md

          if [ "$CHANGELOG_FOUND" = "true" ]; then
            cat changelog_section.md >> release_notes.md
            echo "" >> release_notes.md
          fi

          cat >> release_notes.md << 'RELEASE_NOTES_EOF'
          ### Install

          ```bash
          RELEASE_NOTES_EOF
          printf 'curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | bash\n' "$REPO" >> release_notes.md
          cat >> release_notes.md << 'RELEASE_NOTES_EOF'
          ```

          Installs the signed binary for your platform to `~/.local/bin/loom` and runs `loom install-assets`, which writes loom's agents, skills, commands and hooks into `~/.claude/` and `~/.codex/` — the binary alone is not a working install. Requires `jq` and `minisign`.

          RELEASE_NOTES_EOF
          printf 'Pinned downloads, WSL2 notes, signature verification with minisign and `SHA256SUMS.txt` checksums: [Installation](https://github.com/%s/blob/%s/README.md#1-install-loom). Signed binaries and `.minisig` files are attached below.\n' "$REPO" "$TAG" >> release_notes.md

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: loom ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            release/loom-*
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary (Dry Run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "=== DRY RUN - Release would include these files ==="
          ls -la release/
          echo ""
          echo "=== SHA256SUMS.txt ==="
          cat release/SHA256SUMS.txt
          echo ""
          echo "=== Release Notes ==="
          cat release_notes.md
