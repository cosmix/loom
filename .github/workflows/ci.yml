name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "loom/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "loom/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Build once, save to cache for all subsequent jobs
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            loom/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('loom/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Build all targets
        working-directory: loom
        run: cargo build --all-targets

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            test_cmd: cargo test --all-targets
          - name: macos-build
            os: macos-latest
            test_cmd: cargo test --all-targets --no-run
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            loom/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('loom/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Install tmux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run tests
        working-directory: loom
        run: ${{ matrix.test_cmd }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            loom/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('loom/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Run clippy
        working-directory: loom
        run: cargo clippy --all-targets -- -D warnings

  maintainability:
    name: Maintainability limits
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            loom/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('loom/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Enforce shrinking file and function limits
        working-directory: loom
        run: cargo test --test maintainability

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            loom/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('loom/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Check public documentation
        working-directory: loom
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: loom
        run: cargo fmt --check

  hook-syntax:
    name: Hook syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse every shell hook
        run: ./scripts/check-hook-syntax.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to the Node 24 commit on main: the v2 tag still ships a Node 20
      # runtime, which the runners now warn about. Move back to a tag once
      # rustsec cuts a release past 858dc40.
      - name: Run security audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: loom

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: loom/Cargo.toml
          command: check

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, format, and test
        working-directory: web
        run: bun run check

      - name: Verify the committed bundle is current
        working-directory: web
        run: |
          bun run build
          test -z "$(git status --short --untracked-files=all dist)"

  smoke-web-dashboard:
    name: Web dashboard smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            loom/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('loom/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build the loom binary
        working-directory: loom
        run: cargo build --bin loom

      - name: Run the web dashboard smoke test
        run: ./scripts/smoke-web-dashboard.sh loom/target/debug/loom
