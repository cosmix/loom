name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Every job uses these filters. Include every root-level crate input:
  # embedded assets, include_str! files, Cargo configuration, and Rust-job scripts.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - ".cargo/**"
              - "scripts/run-rust-tests.py"
              - "scripts/rust_test_*.py"
              - "loom/**"
              - "agents/**"
              - "commands/**"
              - "skills/**"
              - "codex/skills/**"
              - "loom-hooks/**"
              - "web/dist/**"
              - "web/src/api/**"
              - "*.md.template"
              - "install.sh"
              - "dev-install.sh"
              - "scripts/flake-check.sh"
              - "scripts/smoke-web-*.sh"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            shell:
              - "loom-hooks/**"
              - "scripts/**"
              - "loom/.githooks/**"
              - ".github/workflows/ci.yml"

  # Rust jobs cache dependencies; fresh source mtimes rebuild the workspace.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        working-directory: loom
        run: cargo fmt --check

      - name: Run clippy
        if: ${{ !cancelled() }}
        working-directory: loom
        run: cargo clippy --all-targets -- -D warnings

      - name: Check public documentation
        if: ${{ !cancelled() }}
        working-directory: loom
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  test:
    name: Test (linux)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Confined verification runs criteria under bubblewrap on Linux, and
      # Ubuntu's AppArmor denies the unprivileged user namespace it needs.
      - name: Install tmux, ripgrep and bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y tmux ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        working-directory: loom
        run: cargo test --all-targets
        env:
          LOOM_E2E_REQUIRE_TMUX: "1"

      - name: Run the bubblewrap capsule probe
        working-directory: loom
        run: "cargo test --lib tests_capsule_denies::bwrap::"
        env:
          LOOM_TEST_REQUIRE_SANDBOX_FREE: "1"

      - name: Build the loom binary
        if: ${{ !cancelled() }}
        working-directory: loom
        run: cargo build --bin loom

      - name: Run the web dashboard smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/smoke-web-dashboard.sh loom/target/debug/loom

      - name: Run the web terminal smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/smoke-web-terminal.sh loom/target/debug/loom

  # The Linux jobs never see Darwin's sockets, sandbox, BSD userland or path
  # layout (/var/folders temp dirs that resolve under /private), and most
  # contributors have no Mac to run the suite on. --no-fail-fast reports every
  # failing target in one run.
  test-macos:
    name: Test (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The smoke scripts call rg and jq.
      - name: Install tmux, ripgrep and jq
        run: brew install tmux ripgrep jq

      - name: Run tests
        working-directory: loom
        run: cargo test --all-targets --no-fail-fast
        env:
          LOOM_E2E_REQUIRE_TMUX: "1"

      - name: Build the loom binary
        if: ${{ !cancelled() }}
        working-directory: loom
        run: cargo build --bin loom

      - name: Run the web dashboard smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/smoke-web-dashboard.sh loom/target/debug/loom

      - name: Run the web terminal smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/smoke-web-terminal.sh loom/target/debug/loom

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Re-run the timing-sensitive tests under load
        run: ./scripts/flake-check.sh

  # scripts/flake-check.sh runs unpinned on macOS (no taskset; see its header),
  # and Darwin's scheduler produces different contention from Linux's.
  flake-check-macos:
    name: Flake check (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Re-run the timing-sensitive tests under load
        run: ./scripts/flake-check.sh

  # Runs the lint gates whose result depends on the target OS: clippy and
  # rustdoc both see code under macOS-only cfg. fmt does not, so it runs on
  # Linux only. A separate job from test-macos because a job compiles the
  # crate in one mode.
  lint-macos:
    name: Lint (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        working-directory: loom
        run: cargo clippy --all-targets -- -D warnings

      - name: Check public documentation
        if: ${{ !cancelled() }}
        working-directory: loom
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  hook-syntax:
    name: Hook syntax
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse every shell hook
        run: ./scripts/check-hook-syntax.sh

      # The hook tests call rg, fd and jq; ubuntu ships fd as fdfind.
      - name: Install hook test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find jq
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Run the hook tests
        run: bash loom-hooks/tests/run-all.sh

      # BSD tool shims put a padded wc, BSD stat and BSD date ahead of the GNU
      # tools, the way macOS runs the hooks.
      - name: Run the hook tests with BSD tool shims
        run: LOOM_HOOK_TEST_BSD=1 bash loom-hooks/tests/run-all.sh

      - name: Pre-commit partial-staging regression
        run: ./scripts/test-pre-commit-partial-staging.sh

  # The hooks target macOS's bash 3.2, but the runner image puts a Homebrew
  # bash 5 first on PATH; the symlink and the version check make the job run
  # under 3.2 and fail rather than pass under 5.
  hooks-macos:
    name: Hook tests (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install hook test tools
        run: brew install ripgrep fd jq

      - name: Put the system bash first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"

      - name: Assert bash is 3.2
        id: bash32
        run: |
          version=$(bash -c 'echo "$BASH_VERSION"')
          echo "bash $version"
          case "$version" in
            3.2.*) ;;
            *) echo "expected bash 3.2, got $version"; exit 1 ;;
          esac

      # The three checks below run independently of each other, but only
      # when bash 3.2 is confirmed: under bash 5 they would pass vacuously.
      - name: Parse every shell hook
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        run: ./scripts/check-hook-syntax.sh

      - name: Run the hook tests
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        run: bash loom-hooks/tests/run-all.sh

      - name: Pre-commit partial-staging regression
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        run: ./scripts/test-pre-commit-partial-staging.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to the Node 24 commit on main: the v2 tag still ships a Node 20
      # runtime, which the runners now warn about. Move back to a tag once
      # rustsec cuts a release past 858dc40.
      - name: Run security audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: loom

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: loom/Cargo.toml
          command: check

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, format, and test
        working-directory: web
        run: bun run check

      - name: Verify the committed bundle is current
        working-directory: web
        run: |
          bun run build
          test -z "$(git status --short --untracked-files=all dist)"
