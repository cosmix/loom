name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # The filters below are the only list of paths CI reacts to; every job keys
  # off one of them. The rust filter names each repo-root path the crate reads:
  # the asset roots build/assets.rs embeds, the files src/ and tests/
  # include_str!, and the scripts the Rust jobs run. A new one goes here too.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - "loom/**"
              - "agents/**"
              - "commands/**"
              - "skills/**"
              - "codex/skills/**"
              - "loom-hooks/**"
              - "web/dist/**"
              - "web/src/api/**"
              - "*.md.template"
              - "install.sh"
              - "dev-install.sh"
              - "scripts/flake-check.sh"
              - "scripts/smoke-web-*.sh"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            shell:
              - "loom-hooks/**"
              - "scripts/**"
              - "loom/.githooks/**"
              - ".github/workflows/ci.yml"

  # Each Rust job compiles the loom crate once, in its own mode. The cache
  # holds dependencies only: a fresh checkout gives every source file a new
  # mtime, so cargo rebuilds the workspace crate whatever target/ holds.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        working-directory: loom
        run: cargo fmt --check

      - name: Run clippy
        if: ${{ !cancelled() }}
        working-directory: loom
        run: cargo clippy --all-targets -- -D warnings

      - name: Check public documentation
        if: ${{ !cancelled() }}
        working-directory: loom
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  # cargo test --all-targets also runs the maintainability limits target.
  test:
    name: Test (linux)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tmux and ripgrep
        run: sudo apt-get update && sudo apt-get install -y tmux ripgrep

      - name: Run tests
        working-directory: loom
        run: cargo test --all-targets
        env:
          LOOM_E2E_REQUIRE_TMUX: "1"

      - name: Build the loom binary
        if: ${{ !cancelled() }}
        working-directory: loom
        run: cargo build --bin loom

      - name: Run the web dashboard smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/smoke-web-dashboard.sh loom/target/debug/loom

      - name: Run the web terminal smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/smoke-web-terminal.sh loom/target/debug/loom

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Re-run the timing-sensitive tests under load
        run: ./scripts/flake-check.sh

  # Type-checks every target on macOS and runs the lints that only fire under
  # macOS cfg, without the codegen and linking a test build would add.
  macos:
    name: Clippy (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        working-directory: loom
        run: cargo clippy --all-targets -- -D warnings

  hook-syntax:
    name: Hook syntax
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse every shell hook
        run: ./scripts/check-hook-syntax.sh

      # The hook tests call rg, fd and jq; ubuntu ships fd as fdfind.
      - name: Install hook test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find jq
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Run the hook tests
        run: bash loom-hooks/tests/run-all.sh

      # BSD tool shims put a padded wc, BSD stat and BSD date ahead of the GNU
      # tools, the way macOS runs the hooks.
      - name: Run the hook tests with BSD tool shims
        run: LOOM_HOOK_TEST_BSD=1 bash loom-hooks/tests/run-all.sh

      - name: Pre-commit partial-staging regression
        run: ./scripts/test-pre-commit-partial-staging.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to the Node 24 commit on main: the v2 tag still ships a Node 20
      # runtime, which the runners now warn about. Move back to a tag once
      # rustsec cuts a release past 858dc40.
      - name: Run security audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: loom

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: loom/Cargo.toml
          command: check

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, format, and test
        working-directory: web
        run: bun run check

      - name: Verify the committed bundle is current
        working-directory: web
        run: |
          bun run build
          test -z "$(git status --short --untracked-files=all dist)"
