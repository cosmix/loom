name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # A manual run skips the path filter and runs every job.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Without debuginfo the lib test crate's rustc peaks near 8.5 GB instead of
  # 10.4 GB. Panic messages keep file and line; backtraces lose line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Every job uses these filters. Include every root-level crate input:
  # embedded assets, include_str! files, Cargo configuration, and Rust-job scripts.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      shell: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            rust:
              - ".cargo/**"
              - "scripts/run-rust-tests.py"
              - "scripts/rust_test_*.py"
              - "loom/**"
              - "agents/**"
              - "commands/**"
              - "skills/**"
              - "codex/skills/**"
              - "plan-plugin/**"
              - "loom-hooks/**"
              - "web/dist/**"
              - "web/src/api/**"
              - "web/src/plan/api/**"
              - "*.md.template"
              - "install.sh"
              - "dev-install.sh"
              - "scripts/flake-check.sh"
              - "scripts/smoke-web-*.sh"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            shell:
              - "loom-hooks/**"
              - "scripts/**"
              - "install.sh"
              - "dev-install.sh"
              - "doc/loom/knowledge/**"
              - "loom/.githooks/**"
              - "loom/tests/completion_shell_paths.sh"
              - "skills/loom-auth/SKILL.md"
              - "skills/loom-c/SKILL.md"
              - "skills/loom-concurrency/SKILL.md"
              - ".github/workflows/ci.yml"

  # Rust jobs cache dependencies; fresh source mtimes rebuild the workspace.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        working-directory: loom
        run: cargo fmt --check

      - name: Run clippy
        if: ${{ !cancelled() }}
        working-directory: loom
        run: cargo clippy --all-targets -- -D warnings

      - name: Check public documentation
        if: ${{ !cancelled() }}
        working-directory: loom
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  # The suites run as parallel jobs: one job running the lib and the
  # integration targets back to back set the wall-clock length of CI. Each
  # job builds only its own targets.
  test:
    name: Test (linux, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: lib
            cargo-args: --lib --bins
            test-args: "--skip stage_cache::toolchain_tests::"
          - suite: integration
            cargo-args: --test '*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # One dependency cache for every test and flake-check job on this OS: a
      # job that passes refreshes it for the jobs that failed.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: loom
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      - name: Check Maven is 3.9 or later
        run: |
          mvn -v
          line=$(mvn -v | head -n 1)
          case "$line" in
            "Apache Maven 3.9."*|"Apache Maven 3."[1-9][0-9].*) ;;
            *) echo "expected Maven 3.9 or a later 3.x, got: $line"; exit 1 ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # The uv and bun confinement tests skip when their tool is not on PATH
      # and fail when the variable naming it points at no file. Naming both
      # here makes a tool that stops being installed fail the strict run.
      - name: Require uv and bun for the confinement tests
        run: |
          echo "LOOM_TEST_UV_BIN=$(command -v uv)" >> "$GITHUB_ENV"
          echo "LOOM_TEST_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache

      - name: Check cmake
        run: cmake --version

      # Confined verification runs criteria under bubblewrap on Linux, and
      # Ubuntu's AppArmor denies the unprivileged user namespace it needs.
      - name: Install tmux, ripgrep, bubblewrap and zsh
        id: tools
        run: |
          sudo apt-get update && sudo apt-get install -y tmux ripgrep bubblewrap zsh
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the bubblewrap capsule probe
        if: matrix.suite == 'lib'
        working-directory: loom
        run: "cargo test --lib tests_capsule_denies::bwrap::"
        env:
          LOOM_TEST_REQUIRE_SANDBOX_FREE: "1"

      # The toolchain probes need seeded host caches and run in nightly.yml.
      - name: Run tests
        working-directory: loom
        run: cargo test ${{ matrix.cargo-args }} --no-fail-fast -- ${{ matrix.test-args }}
        env:
          LOOM_E2E_REQUIRE_TMUX: "1"
          LOOM_TEST_REQUIRE_SANDBOX_FREE: "1"

      - name: Build the loom binary
        id: build
        if: ${{ !cancelled() && matrix.suite == 'integration' }}
        working-directory: loom
        run: cargo build --bin loom

      # The smoke scripts need the binary and the rg the tools step installs;
      # without them they only repeat an earlier step's failure.
      - name: Run the web dashboard smoke test
        if: ${{ !cancelled() && matrix.suite == 'integration' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: ./scripts/smoke-web-dashboard.sh loom/target/debug/loom

      - name: Run the web terminal smoke test
        if: ${{ !cancelled() && matrix.suite == 'integration' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: ./scripts/smoke-web-terminal.sh loom/target/debug/loom

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: loom
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Re-run the timing-sensitive tests under load
        run: ./scripts/flake-check.sh

  # scripts/flake-check.sh runs unpinned on macOS (no taskset; see its header),
  # and Darwin's scheduler produces different contention from Linux's.
  flake-check-macos:
    name: Flake check (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: loom
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Re-run the timing-sensitive tests under load
        run: ./scripts/flake-check.sh

  # Runs the lint gates whose result depends on the target OS: clippy and
  # rustdoc both see code under macOS-only cfg. fmt does not, so it runs on
  # Linux only. A separate job from nightly.yml's test-macos because a job
  # compiles the crate in one mode.
  lint-macos:
    name: Lint (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: loom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        working-directory: loom
        run: cargo clippy --all-targets -- -D warnings

      - name: Check public documentation
        if: ${{ !cancelled() }}
        working-directory: loom
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  hook-syntax:
    name: Hook syntax
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse every shell hook
        run: ./scripts/check-hook-syntax.sh

      # The hook tests call rg, fd and jq; ubuntu ships fd as fdfind. The
      # completion regression below drives Bash through expect, and fish.
      - name: Install hook test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find jq expect fish
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # The real-binary hook tests skip without a current binary; a skip here
      # would be a silent pass, so the steps below require one.
      - name: Build the loom binary
        run: cargo build --locked --bin loom --manifest-path loom/Cargo.toml

      - name: Knowledge check
        run: loom/target/debug/loom knowledge check --strict --baseline doc/loom/knowledge/check-baseline.txt

      - name: Run the hook tests
        run: LOOM_HOOK_TEST_REQUIRE_BINARY=1 bash loom-hooks/tests/run-all.sh

      # BSD tool shims put a padded wc, BSD stat and BSD date ahead of the GNU
      # tools, the way macOS runs the hooks.
      - name: Run the hook tests with BSD tool shims
        run: LOOM_HOOK_TEST_REQUIRE_BINARY=1 LOOM_HOOK_TEST_BSD=1 bash loom-hooks/tests/run-all.sh

      - name: Pre-commit partial-staging regression
        run: ./scripts/test-pre-commit-partial-staging.sh

      - name: Development installer regression
        run: python3 -m unittest discover -s scripts/tests -p test_dev_install.py

      - name: Installer regression
        run: python3 -m unittest discover -s scripts/tests -p test_install.py

      - name: Workflow regression
        run: python3 -m unittest discover -s scripts/tests -p test_workflows.py

      - name: Changelog section priority regression
        run: bash scripts/tests/changelog-section-priority.sh

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # The skill examples build against tokio offline, from the registry cache.
      # loom enables no tokio macros, so its own fetch leaves tokio-macros out;
      # a scratch crate with the examples' features fills the cache.
      - name: Fetch the Cargo registry
        run: |
          cargo fetch --locked --manifest-path loom/Cargo.toml
          cargo new --bin --quiet "$RUNNER_TEMP/tokio-cache"
          cargo add --manifest-path "$RUNNER_TEMP/tokio-cache/Cargo.toml" tokio@1 --features rt,macros
          cargo fetch --manifest-path "$RUNNER_TEMP/tokio-cache/Cargo.toml"

      - name: Terminal reader and skill example regressions
        run: python3 -m unittest discover -s scripts/tests -p test_terminal_and_skill_examples.py

      # The script skips a shell it cannot run, for machines without one. This
      # job installs them all, so a skip here would be a silent pass.
      - name: Completion shell path regression
        run: |
          output=$(bash loom/tests/completion_shell_paths.sh)
          echo "$output"
          case "$output" in
            *SKIP*) echo "expected every completion check to run"; exit 1 ;;
          esac

  # Use the system bash 3.2 and require the real-binary hook test on macOS.
  hooks-macos:
    name: Hook tests (macos)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install hook test tools
        run: brew install ripgrep fd jq

      - name: Put the system bash first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"

      - name: Assert bash is 3.2
        id: bash32
        run: |
          version=$(bash -c 'echo "$BASH_VERSION"')
          echo "bash $version"
          case "$version" in
            3.2.*) ;;
            *) echo "expected bash 3.2, got $version"; exit 1 ;;
          esac

      - name: Install Rust toolchain
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Build the loom binary
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        run: cargo build --locked --bin loom --manifest-path loom/Cargo.toml

      - name: Parse every shell hook
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        run: ./scripts/check-hook-syntax.sh

      - name: Run the hook tests
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        run: LOOM_HOOK_TEST_REQUIRE_BINARY=1 bash loom-hooks/tests/run-all.sh

      - name: Pre-commit partial-staging regression
        if: ${{ !cancelled() && steps.bash32.outcome == 'success' }}
        run: ./scripts/test-pre-commit-partial-staging.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # cargo audit directly: rustsec/audit-check fails on pull_request events
      # whenever an informational warning exists, because it cannot update the
      # check run it reports through. Vulnerabilities fail this step;
      # unmaintained and unsound notices are printed only.
      - name: Run security audit
        run: |
          cargo install --locked cargo-audit
          cargo audit --file loom/Cargo.lock

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          manifest-path: loom/Cargo.toml
          command: check

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, format, and test
        working-directory: web
        run: bun run check

      # ubuntu-latest ships Google Chrome at the scripts' default path.
      - name: Run the browser regressions
        working-directory: web
        run: bun run test:browser

      - name: Verify the committed bundle is current
        working-directory: web
        run: |
          bun run build
          test -z "$(git status --short --untracked-files=all dist)"
