          echo "LOOM_TEST_GO_SEED_MODULE=github.com/pkg/errors@v0.9.1" >> "$GITHUB_ENV"
          echo "LOOM_TEST_MAVEN_SEED=commons-lang:commons-lang:2.6" >> "$GITHUB_ENV"
          echo "LOOM_TEST_GRADLE_SEED=commons-lang:commons-lang:2.6" >> "$GITHUB_ENV"

      - name: Run the confined toolchain probes
        working-directory: loom
        run: "cargo test --lib -- stage_cache:: verify::criteria::confine::host::stage_cache_tests:: --nocapture --test-threads=1"
        env:
          LOOM_TEST_REQUIRE_SANDBOX_FREE: "1"
          SCCACHE_LOG: debug

      - name: Show sandbox denials
        if: failure()
        run: log show --last 45m --style compact --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "deny("' | tail -n 400
