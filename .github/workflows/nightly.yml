          # `mvn -o -B compile` needs (resources, compiler, surefire) besides
          # the dependency.
          maven_seed="$RUNNER_TEMP/maven-seed"
          mkdir -p "$maven_seed/src/main/java"
          cat > "$maven_seed/pom.xml" <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>example</groupId>
            <artifactId>seed</artifactId>
            <version>1</version>
