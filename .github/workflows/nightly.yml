          echo "LOOM_TEST_GO_SEED_MODULE=github.com/pkg/errors@v0.9.1" >> "$GITHUB_ENV"
          echo "LOOM_TEST_MAVEN_SEED=commons-lang:commons-lang:2.6" >> "$GITHUB_ENV"
          echo "LOOM_TEST_GRADLE_SEED=commons-lang:commons-lang:2.6" >> "$GITHUB_ENV"

      # The native-worker boundary kernel tests start target/debug/loom as the
      # Seatbelt bridge (native_worker::boundary::loom_program::built_loom);
      # `cargo test --lib --bins` builds only test harnesses, so without this
      # step the strict run fails them as skips.
      - name: Build the loom binary for the boundary kernel tests
        if: ${{ matrix.suite == 'lib' }}
        working-directory: loom
        run: cargo build --bin loom

      # Runs after the seeding: LOOM_TEST_REQUIRE_SANDBOX_FREE fails every
      # toolchain probe whose seed variable is not yet in GITHUB_ENV.
      - name: Run tests
        working-directory: loom
        run: cargo test ${{ matrix.cargo-args }} --no-fail-fast -- ${{ matrix.test-args }}
        env:
          LOOM_E2E_REQUIRE_TMUX: "1"
          LOOM_TEST_REQUIRE_SANDBOX_FREE: "1"

      # Runs the lib tests again inside the confinement a host job gives an
      # acceptance criterion (process::sandbox_probe::host_job_lane), so a test
      # that fails or hangs under that boundary fails the commit that adds it.
      # The probe guards may skip there, so LOOM_TEST_REQUIRE_SANDBOX_FREE stays
      # unset; the strict steps above prove the same tests run unconfined. The
      # confined run is the test binary "Run tests" built, so nothing compiles
      # or fetches inside the boundary. libtest names every test still running
      # after 60 seconds; the lane kills the run after 25 minutes and the step
      # timeout backs that bound. The lane fails when the confined run passed
      # no test, and the step fails unless the lane itself ran and passed: a
      # filter that matches nothing makes libtest report success on zero tests.
      - name: Run the lib tests under host-job confinement
        if: ${{ !cancelled() && matrix.suite == 'host-lane' }}
        working-directory: loom
        timeout-minutes: 30
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/host-job-lane.log"
          cargo test --lib -- --ignored --exact process::sandbox_probe::host_job_lane::the_lib_tests_pass_under_host_job_confinement --nocapture 2>&1 | tee "$log"
          grep '^test result:' "$log" | tail -n 1 | grep -q '^test result: ok\. 1 passed;'

      - name: Build the loom binary
        id: build
        if: ${{ !cancelled() && matrix.suite == 'integration' }}
        working-directory: loom
        run: cargo build --bin loom

      # The smoke scripts need the binary and the rg the tools step installs;
      # without them they only repeat an earlier step's failure.
      - name: Run the web dashboard smoke test
        if: ${{ !cancelled() && matrix.suite == 'integration' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: ./scripts/smoke-web-dashboard.sh loom/target/debug/loom

      - name: Run the web terminal smoke test
        if: ${{ !cancelled() && matrix.suite == 'integration' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: ./scripts/smoke-web-terminal.sh loom/target/debug/loom

  # The macOS toolchain probes, with every probe's output and, on failure,
  # the sandbox's own denial log.
  macos-probes:
    name: Toolchain probes (macos)
    needs: changes
    if: needs.changes.outputs.run == 'true' && (inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'macos' || inputs.jobs == 'macos-probes' || inputs.jobs == 'probes')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
