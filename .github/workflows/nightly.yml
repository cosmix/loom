name: Nightly

# The slow gates, off the push path: the macOS suites (the lib test crate's
# rustc needs more memory than the 7 GB macOS runner has, so that build swaps)
# and the strict toolchain probes, which need seeded host caches.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs to run"
        type: choice
        default: all
        options:
          - all
          - linux-probes
          - macos
          - macos-probes
          - probes
  pull_request:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Without debuginfo the lib test crate's rustc peaks near 8.5 GB instead of
  # 10.4 GB. Panic messages keep file and line; backtraces lose line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # A scheduled run tests main only when it moved since the last completed
  # scheduled run; a failed run is not retried on the same commit, since it
  # would fail the same way. Dispatches and pull requests always run.
  changes:
    name: Detect new commits
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Compare with the last scheduled run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?event=schedule&status=completed&per_page=1" \
            -q '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is unchanged since the last scheduled run ($last); skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # LOOM_TEST_REQUIRE_SANDBOX_FREE turns every skip into a failure, so a
  # missing toolchain or launcher is a red build.
  toolchain-probes:
    name: Toolchain probes (linux)
    needs: changes
    # inputs.jobs is empty on schedule and pull_request runs.
    if: needs.changes.outputs.run == 'true' && (inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'linux-probes' || inputs.jobs == 'probes')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # One dependency cache for every test and flake-check job on this OS: a
      # job that passes refreshes it for the jobs that failed.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: loom
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          # The repository has no go.sum to key a module cache on.
          cache: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      - name: Check Maven is 3.9 or later
        run: |
          mvn -v
          line=$(mvn -v | head -n 1)
          case "$line" in
            "Apache Maven 3.9."*|"Apache Maven 3."[1-9][0-9].*) ;;
            *) echo "expected Maven 3.9 or a later 3.x, got: $line"; exit 1 ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          # The repository has no Python lock or requirements file to key a cache on.
          enable-cache: false

      # The uv and bun confinement tests skip when their tool is not on PATH
      # and fail when the variable naming it points at no file. Naming both
      # here makes a tool that stops being installed fail the strict run.
      - name: Require uv and bun for the confinement tests
        run: |
          echo "LOOM_TEST_UV_BIN=$(command -v uv)" >> "$GITHUB_ENV"
          echo "LOOM_TEST_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache

      - name: Check cmake
        run: cmake --version

      # Confined verification runs criteria under bubblewrap on Linux, and
      # Ubuntu's AppArmor denies the unprivileged user namespace it needs.
      - name: Install tmux, ripgrep, bubblewrap and zsh
        id: tools
        run: |
          sudo apt-get update && sudo apt-get install -y tmux ripgrep bubblewrap zsh
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Seeds the host caches that stage_cache::toolchain_tests:: reads, then
      # exports the coordinates the probes need through GITHUB_ENV.
      - name: Seed the toolchain caches
        run: |
          go_seed="$RUNNER_TEMP/go-seed"
          mkdir -p "$go_seed"
          (cd "$go_seed" && go mod init seed && go mod download github.com/pkg/errors@v0.9.1)
          # Compiling unconfined fetches every plugin the probe's offline
          # `mvn -o -B compile` needs (resources, compiler, surefire) besides
          # the dependency.
          maven_seed="$RUNNER_TEMP/maven-seed"
          mkdir -p "$maven_seed/src/main/java"
          cat > "$maven_seed/pom.xml" <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>example</groupId>
            <artifactId>seed</artifactId>
            <version>1</version>
            <properties>
              <maven.compiler.source>11</maven.compiler.source>
              <maven.compiler.target>11</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency>
                <groupId>commons-lang</groupId>
                <artifactId>commons-lang</artifactId>
                <version>2.6</version>
              </dependency>
            </dependencies>
          </project>
          EOF
          cat > "$maven_seed/src/main/java/App.java" <<'EOF'
          public class App {
              public static void main(String[] args) {}
          }
          EOF
          (cd "$maven_seed" && mvn -q -B compile)
          gradle_seed="$RUNNER_TEMP/gradle-seed"
          mkdir -p "$gradle_seed/src/main/java/seed"
          cat > "$gradle_seed/settings.gradle" <<'EOF'
          rootProject.name = 'seed'
          EOF
          cat > "$gradle_seed/build.gradle" <<'EOF'
          plugins {
              id 'java'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              implementation 'commons-lang:commons-lang:2.6'
          }
          EOF
          cat > "$gradle_seed/src/main/java/seed/Seed.java" <<'EOF'
          package seed;

          import org.apache.commons.lang.StringUtils;

          public class Seed {
              public static void main(String[] args) {
                  System.out.println(StringUtils.isBlank(" "));
              }
          }
          EOF
          (cd "$gradle_seed" && gradle -q --no-daemon compileJava)
          echo "LOOM_TEST_GO_SEED_MODULE=github.com/pkg/errors@v0.9.1" >> "$GITHUB_ENV"
          echo "LOOM_TEST_MAVEN_SEED=commons-lang:commons-lang:2.6" >> "$GITHUB_ENV"
          echo "LOOM_TEST_GRADLE_SEED=commons-lang:commons-lang:2.6" >> "$GITHUB_ENV"

      # Runs every stage_cache:: test and the confine stage-cache tests, among
      # them the confined toolchain probes in stage_cache::toolchain_tests::.
      # LOOM_TEST_REQUIRE_SANDBOX_FREE turns every skip into a failure, so a
      # missing toolchain or launcher on either runner is a red build.
      - name: Run the confined toolchain probes
        working-directory: loom
        run: "cargo test --lib -- stage_cache:: verify::criteria::confine::host::stage_cache_tests::"
        env:
          LOOM_TEST_REQUIRE_SANDBOX_FREE: "1"


  # The Linux jobs never see Darwin's sockets, sandbox, BSD userland or path
  # layout (/var/folders temp dirs that resolve under /private), and most
  # contributors have no Mac to run the suite on. --no-fail-fast reports every
  # failing target in one run.
  # The host-job lane gets its own job: it reruns the whole lib suite
  # confined, for up to 30 minutes. Its "Run tests" step only builds the lib
  # test binary the lane runs.
  test-macos:
    name: Test (macos, ${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.run == 'true' && (inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'macos')
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: lib
            cargo-args: --lib --bins
            # The probes run once, with their output, in macos-probes.
            test-args: "--skip stage_cache::toolchain_tests::"
          - suite: integration
            cargo-args: --test '*'
          - suite: host-lane
            cargo-args: --lib --no-run
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: loom
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          # The repository has no go.sum to key a module cache on.
          cache: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      - name: Check Maven is 3.9 or later
        run: |
          mvn -v
          line=$(mvn -v | head -n 1)
          case "$line" in
            "Apache Maven 3.9."*|"Apache Maven 3."[1-9][0-9].*) ;;
            *) echo "expected Maven 3.9 or a later 3.x, got: $line"; exit 1 ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          # The repository has no Python lock or requirements file to key a cache on.
          enable-cache: false

      # The uv and bun confinement tests skip when their tool is not on PATH
      # and fail when the variable naming it points at no file. Naming both
      # here makes a tool that stops being installed fail the strict run.
      - name: Require uv and bun for the confinement tests
        run: |
          echo "LOOM_TEST_UV_BIN=$(command -v uv)" >> "$GITHUB_ENV"
          echo "LOOM_TEST_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install ccache
        run: brew install ccache

      - name: Check cmake
        run: cmake --version

      # The smoke scripts call rg and jq.
      - name: Install tmux, ripgrep and jq
        id: tools
        run: brew install tmux ripgrep jq

      # Seeds the host caches that stage_cache::toolchain_tests:: reads, then
      # exports the coordinates the probes need through GITHUB_ENV.
