# Ground-truth cases for `loom knowledge eval` (doc/PROPOSAL-retrieval-precision.md
# section 5, Appendix A.20). Every `expect`/`relevant`/`forbid` id below was
# observed in real `loom knowledge context --query "<text>" --budget-tokens <n> --json |
# jq -r '.items[].id'` output from THIS checkout, re-verified immediately
# before this file was committed - none is invented, and `expect`/`forbid`
# never name an id that did not actually come back for its query.
#
# The `forbid` cases (the three prose/symbol-collision cases, the
# filesystem-path case, and the two machine-generated-prompt cases) were
# seeded FAILING: their `forbid` ids are what the live index returned for
# these queries before the failure shapes Appendix A.1-A.6/A.24 addressed
# (identifier-shaped evidence for exact rungs, query stopwording, the source
# channel's candidacy floor, test-path downweight, magnitude-aware fusion, the
# emit floor). All six pass today, so any one of them going FAIL again is a
# real regression rather than eval-harness noise.
#
# The `expect` cases are wins that must NOT regress: a hit within the top 5,
# most of them ranked 1st.
#
# pass_floor keeps Appendix A.20's original hit-rate meaning.
#
# precision_at_5 and relevant_token_fraction are judged over different packs
# depending on `mode`: a `mode: prompt` case (the default) is judged over the
# pack the hook would actually hand a fresh session - 0.0 for either metric
# when the hook would abstain - since that is what a prompt-triggered brief
# actually delivers; a `mode: stage` case is judged over the raw retrieved
# pack, since an autonomous stage spawn sees the best available retrieval
# regardless of the hook's emit floor. hit@5, mrr, forbid checks, mandatory
# recall, and rendered-token cost are always judged over the raw pack. See
# `loom/src/commands/knowledge/eval/metrics.rs::score_case`/`judged_pack`.
#
# precision_floor = measured precision_at_5 on this checkout on 2026-10-01
# (0.45) x 0.9, rounded down to two decimals = 0.40. Most cases judge a single
# relevant id, so the raw-pack metric this replaced for `mode: prompt`
# caps every case's p@5 near 0.20 in a 5-item pack regardless of ranking
# quality - the delivered-set metric does not have that ceiling, since the
# hook narrows the pack to what actually cleared its emit floor before
# judging. Before this stage's (already-in-tree) emit-floor change, the
# delivered-set p@5 was 0.32.
#
# Per-case p@5 contributions behind the 0.45 mean (`--json`'s `cases[].precision_at_5`;
# re-judge here if a case's ids change):
#   genuine-win-phantom-merges                        0.20  (prompt)
#   genuine-win-sandbox-settings-rules                1.00  (prompt)
#   genuine-win-source-graph-honesty-contract         1.00  (prompt)
#   genuine-win-delivery-epoch-suppression            1.00  (prompt)
#   genuine-win-session-identity-env-staleness        0.50  (prompt)
#   tier-twin-sandbox-contradictory-path-rules        0.50  (prompt)
#   symbol-query-backticked-plan-key                  0.20  (prompt)
#   symbol-query-snake-case-reconcile-source-graph    0.20  (prompt)
#   genuine-win-stage-mode-source-node                0.20  (stage)
#   symbol-question-plan-key-unquoted                 0.20  (prompt)
#   symbol-question-reconcile-source-graph-defined    0.20  (prompt)
#   relationship-callers-of-reconcile-source-graph    0.20  (prompt)
pass_floor: 0.5
precision_floor: 0.40

cases:
  # --- Failure shape 1: prose words collide with symbol names (A.1) -------
  - name: prose-symbol-collision-repair-point-complete
    query: "why doesn't loom repair --fix do it, the point is that the plan should complete"
    forbid:
      - "entry-points.md#command-dispatch-cli-types-rs#0"
      - "loom/src/commands/stage/complete.rs#function:complete"
      - "loom/src/commands/repair.rs#function:fix_issue"

  - name: prose-symbol-collision-configure-hooks
    query: "how do I configure the hooks so sessions get the right settings"
    forbid:
      - "loom/src/fs/permissions/hooks.rs#function:configure_loom_hooks"
      - "entry-points.md#command-dispatch-cli-types-rs#0"

  # A one-word collision, which the two above cannot reach: `remaining` is
  # neither back-ticked nor identifier-shaped, so it was admitted by corpus
  # rarity alone (`ExactGate::is_rare`) and led this pack at 94.7 points with an
  # `exact-symbol` reason. Observed in a real Knowledge Brief, not constructed.
  - name: prose-symbol-collision-remaining-knowledge-files
    query: "read the remaining knowledge files that are relevant"
    budget_tokens: 800
    max_rendered_tokens: 1600
    forbid:
      - "loom/src/daemon/server/admission.rs#function:DeadlineReader::remaining"

  # --- Failure shape 2: a filesystem path extracts prose-collision terms --
  - name: filesystem-path-write-home-collision
    query: "write the recommendation in /home/dkaponis/src/loom/doc"
    forbid:
      - "loom/tests/integration/plan_verify.rs#constant:LOOM"
      - "loom/src/orchestrator/scheduling_report.rs#function:write"

  # --- Failure shape 3: machine-generated prompts have no type filter (A.4)
  # These pin the retrieval-side symptom: even after the hook stops calling
  # retrieval for these prompt shapes (A.4), a caller who DOES query with one
  # (the CLI, or a stage brief seeded from raw agent output) should see the
  # candidacy floor (A.2) and shaped-evidence gate (A.1) suppress this noise,
  # since none of the XML/notice vocabulary is identifier-shaped or rare.
  - name: machine-generated-task-notification-noise
    query: '<task-notification><agent name="reviewer">Background agent finished</agent><status>completed</status></task-notification>'
    forbid:
      - "loom/src/commands/status.rs#module:merge_status"
      - "loom/src/git/merge/status.rs#implementation:MergeStatusReport"
      - "mistakes/sessions-and-liveness.md#in-memory-dedup-makes-every-daemon-restart-replay-old-crashes-2026-08-10#0"

  - name: machine-generated-background-agent-stopped-noise
    query: 'Background agent "reviewer" was stopped by the user.'
    forbid:
      - "loom/src/orchestrator/terminal/native/window_ops.rs#function:close_window_by_title"
      - "loom/src/orchestrator/terminal/native/window_ops.rs#function:window_exists_by_title"
      - "loom/src/orchestrator/core/spool_drain_tests.rs#function:entry_is_attributed_to_the_worktree_it_was_spooled_in_not_a_sibling_stage"

  # --- Prompts for which unsolicited retrieval should stay silent --------
  - name: conversational-correction-abstains
    query: "no, use the repository version of those files, not the installed copies"
    abstain: true

  - name: farewell-abstains
    query: "thanks, that is all for now, nothing else to do here"
    abstain: true

  # --- Genuine wins: must not regress -------------------------------------
  - name: genuine-win-phantom-merges
    query: "phantom merge lesson stage marked merged but branch never actually merged"
    expect:
      - "mistakes/phantom-merges.md#phantom-merges-from-defensive-assume-merged-branches-2026-04-15#0"
    relevant:
      - "mistakes/phantom-merges.md#phantom-merges-from-defensive-assume-merged-branches-2026-04-15#0"

  # Re-judged 2026-10-01 at this case's 1500-token budget. Ranks 1-3 answer the
  # query directly: the capsule's write grants and the worktree-isolation key
  # (both architecture/security-and-isolation.md) and `sandbox_settings`, which
  # builds the capsule's sandbox block. Rank 4 (the rescue-floor section) only
  # quotes this query; rank 5 is the daemon pointer. The two mistakes chunks
  # this case expected before ranked 17th and 21st in a 20000-token pack. The
  # whole-object-rebuild lesson describes the settings.local.json rebuild the
  # session capsule replaced, so it no longer answers the query; the
  # contradictory-path-rules invariant still does and stays relevant.
  - name: genuine-win-sandbox-settings-rules
    query: "sandbox settings rules for claude code worktree sessions"
    expect:
      - "architecture/security-and-isolation.md#where-a-session-s-write-grants-come-from#0"
      - "architecture/security-and-isolation.md#claude-code-worktree-isolation-disabled-in-generated-settings#0"
    relevant:
      - "architecture/security-and-isolation.md#where-a-session-s-write-grants-come-from#0"
      - "architecture/security-and-isolation.md#claude-code-worktree-isolation-disabled-in-generated-settings#0"
      - "loom/src/sandbox/settings/policy.rs#function:sandbox_settings"
      - "mistakes/sandbox-and-settings.md#sandbox-contradictory-path-rules#0"

  - name: genuine-win-source-graph-honesty-contract
    query: "Honesty Contract"
    expect:
      - "architecture/source-graph.md#the-honesty-contract#0"
    relevant:
      - "architecture/source-graph.md#the-honesty-contract#0"

  # The section moved to the context-retrieval-state topic when
  # context-retrieval.md was split; the new id was observed at rank 1 on
  # 2026-09-30.
  - name: genuine-win-delivery-epoch-suppression
    query: "Delivery Records and Epoch Suppression"
    expect:
      - "architecture/context-retrieval-state.md#delivery-records-and-epoch-suppression#0"
    relevant:
      - "architecture/context-retrieval-state.md#delivery-records-and-epoch-suppression#0"

  # The topic spilled into a tier-2 file that repeats the tier-1 heading, so the
  # packer returns the detail and drops the summary (see the tier-twin case
  # below); the tier-2 id is the one observed at rank 1 on 2026-09-19.
  - name: genuine-win-session-identity-env-staleness
    query: "per session identity persisted in settings env blocks goes stale"
    expect:
      - "mistakes/session-identity-env.md#per-session-identity-persisted-in-settings-env-blocks-goes-stale-and-shadows-the-wrapper-env-2026-07-22#0"
    relevant:
      - "mistakes/session-identity-env.md#per-session-identity-persisted-in-settings-env-blocks-goes-stale-and-shadows-the-wrapper-env-2026-07-22#0"

  # A tier-1 summary and the tier-2 topic it spilled share a heading verbatim
  # (`loom knowledge update` scaffolds the topic file with it), so they scored
  # within a rounding error of each other on this query and BOTH came back —
  # the summary spending budget to point at text directly above it. The packer
  # now takes the detail and drops the summary, keeping the summary only when
  # the detail does not fit the budget (`context/pack.rs::tier1_twin`).
  - name: tier-twin-sandbox-contradictory-path-rules
    query: "Sandbox: Contradictory Path Rules"
    expect:
      - "mistakes/sandbox-and-settings.md#sandbox-contradictory-path-rules#0"
    relevant:
      - "mistakes/sandbox-and-settings.md#sandbox-contradictory-path-rules#0"
    forbid:
      - "mistakes.md#sandbox-contradictory-path-rules#0"

  # --- Symbol queries that SHOULD reach source nodes ----------------------
  - name: symbol-query-backticked-plan-key
    query: "what does `plan_key` do"
    expect:
      - "loom/src/context/delivery.rs#function:plan_key"
    relevant:
      - "loom/src/context/delivery.rs#function:plan_key"

  - name: symbol-query-snake-case-reconcile-source-graph
    query: "where is reconcile_source_graph called"
    expect:
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"
    relevant:
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"

  # --- mode: stage exercise --------------------------------------------
  # Same target as symbol-query-snake-case-reconcile-source-graph above, but
  # through the mode: stage path: stage_fields get newline-joined onto query
  # (build_query_text, mirroring build_stage_query_text at
  # orchestrator/signals/retrieval.rs:128-148) before retrieval ever runs, so
  # this also demonstrates that an ExactPath/ExactSymbol rung survives the
  # dilution a real stage's file/acceptance-criteria list adds, where a
  # lexical-only prose match would not.
  - name: genuine-win-stage-mode-source-node
    query: "fix reconcile_source_graph so it handles a mid-session refresh"
    mode: stage
    stage_fields:
      - "loom/src/context/refresh/source_graph.rs"
      - "cargo test -p loom"
    expect:
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"
    relevant:
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"

  # --- Query intents: symbol questions, plain-word prose, relationships,
  # literal text. The ids are the ones `loom map --find-all` / `--impact` name
  # for this checkout; `plan` and `graph` are module names that plain prose
  # must not reach.
  - name: symbol-question-plan-key-unquoted
    query: "what does plan_key do"
    expect:
      - "loom/src/context/delivery.rs#function:plan_key"
    relevant:
      - "loom/src/context/delivery.rs#function:plan_key"

  - name: symbol-question-reconcile-source-graph-defined
    query: "where is reconcile_source_graph defined"
    expect:
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"
    relevant:
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"

  - name: plain-words-plan-and-graph-prose
    query: "the plan looks fine but the graph of stages is confusing to read"
    forbid:
      - "loom/src/commands/mod.rs#module:plan"
      - "loom/src/lib.rs#module:plan"
      - "loom/src/commands/mod.rs#module:graph"
      - "loom/src/plan/mod.rs#module:graph"

  - name: plain-words-plan-and-graph-request
    query: "I think the plan for this graph needs another pass before we go on"
    forbid:
      - "loom/src/commands/mod.rs#module:plan"
      - "loom/src/lib.rs#module:plan"
      - "loom/src/context/retrieve.rs#module:graph"
      - "loom/src/plan/mod.rs#module:graph"

  - name: relationship-callers-of-reconcile-source-graph
    query: "who calls reconcile_source_graph"
    expect:
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"
      - "loom/src/orchestrator/merge_lifecycle.rs#function:MergeLifecycle::reconcile"
    relevant:
      - "loom/src/orchestrator/merge_lifecycle.rs#function:MergeLifecycle::reconcile"
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"

  # A quoted message is text in a body, which the graph does not index: the
  # pack carries a `Literal text:` search hint instead of source items. The
  # forbidden ids are the source nodes the words `source graph never built`
  # would otherwise surface (`abstain` covers the whole hook and cannot say
  # "no source item").
  - name: literal-text-source-graph-never-built
    query: 'where do we print "source graph never built"'
    forbid:
      - "loom/src/context/retrieve/graph.rs#constant:NEVER_BUILT_REASON"
      - "loom/src/commands/map.rs#function:report_snapshot"
      - "loom/src/context/refresh/source_graph.rs#function:reconcile_source_graph"
