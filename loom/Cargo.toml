[package]
name = "loom"
version = "0.0.0-dev"
edition = "2021"
description = "Agent orchestration CLI"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
colored = "3"
reqwest = { version = "0.13", features = ["blocking", "json"] }
semver = "1"
dirs = "6"
minisign-verify = "0.2.5"
sha2 = "0.11"
hex = "0.4.3"
serde_yaml = "0.9.34"
uuid = { version = "1.26.0", features = ["v4"] }
toml = "1"
serde_json = "1.0.151"
shell-escape = "0.1.5"
wait-timeout = "0.2.1"
nix = { version = "0.31", features = ["process", "fs", "signal"], default-features = false }
libc = "0.2.189"
ctrlc = { version = "3.5.2", features = ["termination"] }
which = "8.0.6"
regex = "1.13.1"
fs2 = "0.4"
ratatui = "0.30"
crossterm = "0.29"
tracing = "0.1"
glob = "0.3.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
toml_edit = "0.25.13"
shell-words = "1.1.1"
tree-sitter = { version = "=0.27.0", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
streaming-iterator = { version = "=0.1.9", optional = true }

[dev-dependencies]
serial_test = "4.0.1"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "adjudication_e2e"
path = "tests/adjudication_e2e.rs"

[features]
default = ["source-graph"]

# Tree-sitter source extraction. Default-on, but a host without a C toolchain
# (or one that must not build native grammars) can disable it with
# `--no-default-features`: extraction then degrades to file-level lexical nodes
# rather than failing to build.
source-graph = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:streaming-iterator",
]
